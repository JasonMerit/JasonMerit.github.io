<html>
    <h1>P5</h1>

<script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 vPosition;

    uniform mat4 MVP;

    varying vec4 n;
    
    void main() {
        gl_Position = MVP * vPosition;
        n = vPosition;
    }
</script>
<script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    varying vec4 v_color;

    uniform int v_TexIndex;
    uniform sampler2D u_Texture0;
    uniform sampler2D u_Texture1;
    uniform sampler2D u_Texture2;
    uniform sampler2D u_Texture3;
    uniform sampler2D u_Texture4;
    uniform sampler2D u_Texture5;
    uniform sampler2D u_Texture6;
    uniform sampler2D u_Texture7;
    uniform sampler2D u_Texture8;

    uniform int u_Clicked;
    
    varying vec4 n;

    void main() {
        vec2 uv = vec2((1.0 - atan(n.z, n.x)) / (2.0 * 3.14), acos(n.y) / 3.14);
        if (v_TexIndex == 0) {
            gl_FragColor = mix(texture2D(u_Texture0, uv), vec4(0.1, 0.0, 0.0, 1.0), float(u_Clicked));
        } else if (v_TexIndex == 1) {
            gl_FragColor = mix(texture2D(u_Texture1, uv), vec4(0.2, 0.0, 0.0, 1.0), float(u_Clicked));
        } else if (v_TexIndex == 2) {
            gl_FragColor = mix(texture2D(u_Texture2, uv), vec4(0.3, 0.0, 0.0, 1.0), float(u_Clicked));
        } else if (v_TexIndex == 3) {
            gl_FragColor = mix(texture2D(u_Texture3, uv), vec4(0.4, 0.0, 0.0, 1.0), float(u_Clicked));
        } else if (v_TexIndex == 4) {
            gl_FragColor = mix(texture2D(u_Texture4, uv), vec4(0.5, 0.0, 0.0, 1.0), float(u_Clicked));
        } else if (v_TexIndex == 5) {
            gl_FragColor = mix(texture2D(u_Texture5, uv), vec4(0.6, 0.0, 0.0, 1.0), float(u_Clicked));
        } else if (v_TexIndex == 6) {
            gl_FragColor = mix(texture2D(u_Texture6, uv), vec4(0.7, 0.0, 0.0, 1.0), float(u_Clicked));
        } else if (v_TexIndex == 7) {
            gl_FragColor = mix(texture2D(u_Texture7, uv), vec4(0.8, 0.0, 0.0, 1.0), float(u_Clicked));
        } else if (v_TexIndex == 8) {
            gl_FragColor = mix(texture2D(u_Texture8, uv), vec4(0.9, 0.0, 0.0, 1.0), float(u_Clicked));
        }
    }
</script>

<script type="text/javascript" src="../angelCommon/webgl-utils.js"></script>
<script type="text/javascript" src="../angelCommon/initShaders.js"></script>
<script type="text/javascript" src="../angelCommon/MV.js"></script>
<script type="text/javascript" src="P5.js"></script>

</canvas>
</div>
</body>
</html>
