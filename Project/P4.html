<html>
    <h1>P4</h1>

<script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 vPosition;

    uniform mat4 MVP;

    varying vec4 n;
    
    void main() {
        gl_Position = MVP * vPosition;
        n = vPosition;
    }
</script>
<script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    varying vec4 v_color;

    uniform int v_TexIndex;
    uniform sampler2D u_Texture0;
    uniform sampler2D u_Texture1;
    uniform sampler2D u_Texture2;
    uniform sampler2D u_Texture3;
    uniform sampler2D u_Texture4;
    uniform sampler2D u_Texture5;
    uniform sampler2D u_Texture6;
    uniform sampler2D u_Texture7;

    uniform int u_Clicked;
    
    varying vec4 n;

    void main() {
        if (u_Clicked == 1) {
            gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
            return;
        }
        vec2 uv = vec2((1.0 - atan(n.z, n.x)) / (2.0 * 3.14), acos(n.y) / 3.14);
        if (v_TexIndex == 0) {
            gl_FragColor = texture2D(u_Texture0, uv);
        } else if (v_TexIndex == 1) {
            gl_FragColor = texture2D(u_Texture1, uv);
        } else if (v_TexIndex == 2) {
            gl_FragColor = texture2D(u_Texture2, uv);
        } else if (v_TexIndex == 3) {
            gl_FragColor = texture2D(u_Texture3, uv);
        } else if (v_TexIndex == 4) {
            gl_FragColor = texture2D(u_Texture4, uv);
        } else if (v_TexIndex == 5) {
            gl_FragColor = texture2D(u_Texture5, uv);
        } else if (v_TexIndex == 6) {
            gl_FragColor = texture2D(u_Texture6, uv);
        } else if (v_TexIndex == 7) {
            gl_FragColor = texture2D(u_Texture7, uv);
        }
    }
</script>

<script type="text/javascript" src="../angelCommon/webgl-utils.js"></script>
<script type="text/javascript" src="../angelCommon/initShaders.js"></script>
<script type="text/javascript" src="../angelCommon/MV.js"></script>
<script type="text/javascript" src="P4.js"></script>
<body>
<canvas id="gl-canvas" width="512" height="512">

</canvas>
</div>
</body>
</html>
