<html>
    <h1>W07P4</h1>

<script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 vPosition;

    uniform mat4 M;
    uniform mat4 V;
    uniform mat4 P;

    varying vec4 M_T;
    
    varying vec3 n;
    void main() {
        gl_Position = P * V * vPosition;
        M_T = M * vPosition;
        n = vPosition.xyz;
    }
</script>
<script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    varying vec4 v_color;

    uniform samplerCube texMap;
    uniform sampler2D texBumpy;
    
    varying vec4 M_T;
    
    uniform float reflective;
    varying vec3 n;
    uniform vec3 eye;

    vec3 rotate_to_normal(vec3 n, vec3 v) {
        float sgn_nz = sign(n.z + 1.0e-16);
        float a = -1.0/(1.0 + abs(n.z));
        float b = n.x*n.y*a;
        return vec3(1.0 + n.x*n.x*a, b, -sgn_nz*n.x)*v.x
        + vec3(sgn_nz*b, sgn_nz*(1.0 + n.y*n.y*a), -n.y)*v.y
        + n*v.z;
       }
    
    void main() {
        vec2 uv = vec2((1.0 - atan(n.z, n.x)) / (2.0 * 3.14), acos(n.y) / 3.14);
        vec3 normalMap = texture2D(texBumpy, uv).xyz;

        vec3 world_pos = normalize(n);
        vec3 normal_tang = normalize(normalMap * 2.0 - 1.0);
        vec3 normal = rotate_to_normal(world_pos, normal_tang);
        
        vec3 reflection = mix(M_T.xyz, reflect(world_pos - eye, normal), reflective);
        
        // gl_FragColor = texture2D(texBumpy, uv);
        gl_FragColor = textureCube(texMap, reflection);
    }
</script>

<script type="text/javascript" src="../angelCommon/webgl-utils.js"></script>
<script type="text/javascript" src="../angelCommon/initShaders.js"></script>
