<html>
    <h1>W07P2</h1>

<script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 vPosition;

    uniform mat4 M;
    uniform mat4 V;
    uniform mat4 P;

    varying vec4 M_T;
    void main() {
        gl_Position = P * V * vPosition;
        M_T = M * vPosition;
    }
</script>
<script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    varying vec4 v_color;

    uniform samplerCube texMap;
    varying vec4 n;

    varying vec4 M_T;
    void main() {
        // gl_FragColor = v_color * textureCube(texMap, normalize(n.xyz));
        gl_FragColor = textureCube(texMap, M_T.xyz);
    }
</script>

<script type="text/javascript" src="../angelCommon/webgl-utils.js"></script>
