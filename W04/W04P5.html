<html>
  <h1>W04P5</h1>
<script id="vertex-shader" type="x-shader/x-vertex">
  attribute vec4 vPosition; 
  uniform mat4 MVP;         

  varying vec3 fragPosition;

  void main() {
      gl_Position = MVP * vPosition;
      fragPosition = vPosition.xyz;
  }

</script>

<script id="fragment-shader" type="x-shader/x-fragment">
  precision mediump float;

  varying vec3 fragPosition; 

  uniform vec4 lightPos;     
  uniform vec3 observer;
  uniform vec4 ambient;      
  uniform vec4 emission;     
  uniform float diffuse_coef;
  uniform float spec;    
  uniform float shininess;   
  vec4 material = vec4(0.6, 0.0, 0.0, 1.0);

  void main() {
      vec4 n_ = normalize(vec4(fragPosition, 0.0)); // Normal vector
      vec4 light = vec4(0.0, 0.0, -1.0, 0.0);
      vec3 to_light = light.w == 0.0 ? normalize(-light.xyz) : normalize(light.xyz - n_.xyz);  // w_i
      
      vec4 diffuse = diffuse_coef * emission * max(dot(n_.xyz, to_light), 0.0);  // reflected Lr,d
      vec4 ambience = ambient * emission;  // Lr,a

      vec3 wr = 2.0 * dot(n_.xyz, to_light) * n_.xyz - to_light;  // w_r
      vec4 specular = spec * emission * pow(max(dot(wr, observer), 0.0), shininess);  // Lr,s (specular)

      // Perform a back-face lighting test
        if (dot(n_.xyz, to_light) <= 0.0) {
            specular = vec4(0.0); // No spec if light is behind the surface
        }

      gl_FragColor = (diffuse + ambience) * material + specular;  // Lr
  }
</script>



<script type="text/javascript" src="../angelCommon/webgl-utils.js"></script>
<script type="text/javascript" src="../angelCommon/initShaders.js"></script>
<script type="text/javascript" src="../angelCommon/MV.js"></script>
<script type="text/javascript" src="W04P5.js"></script>
<body>
<canvas id="gl-canvas" width="512" height="512">

</canvas>
<div>
<button id="SubdivideButton+">Increase subdivision</button>
<button id="SubdivideButton-">Decrease subdivision</button>
<button id="Spin">Spin</button>
</div>
  <div>
    <input type="range" id="Kd" name="Kd" min="0" max="1" value="0.9" step="0.01" />
    Kd (diffuse)
  </div>
  <div>
    <input type="range" id="Ks" name="Ks" min="0" max="1" value="1.0"step="0.01" />
    Ks (specular)
  </div>
  <div>
    <input type="range" id="s" name="s" min="1" max="1000" value="100"step="0.01" />
    s (shininess)
  </div>
  <div>
    <input type="range" id="Le" name="Le" min="0" max="2.0" value="1.0"step="0.01" />
    Le (emission)
  </div>
  <div>
    <input type="range" id="La" name="La" min="0" max="1" value="0.1"step="0.01" />
    La (ambient)
  </div>
</body>
</html>
