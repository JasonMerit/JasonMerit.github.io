<html>
<script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 vPosition;
    // attribute vec4 aColor;  // Receive color from js
    uniform mat4 MVP;
    uniform mat4 V;
    vec3 observer = vec3(0.0,0.0,1.0);
    const float visibility = 1.0;

    varying vec4 v_color;  // Send color to fragment shader

    uniform vec4 lightPos;
    uniform float diffuse_coef;  // kd
    uniform vec4 ambient; // La
    uniform vec4 emission; // Le

    //Phong parameters
    uniform float specular; // ks
    uniform float shininess; // s
    
    void main() {
        gl_Position = MVP * vPosition;
        vec4 incident_light = visibility * emission;  // Incident light Li

        vec4 n = vPosition;
        n.w = 0.0;
        vec4 light = lightPos;

        vec3 to_light = light.w == 0.0 ? normalize(-light.xyz) : normalize(light.xyz - vPosition.xyz);  // w_i
        vec4 reflected = diffuse_coef * incident_light * max(dot(n.xyz, to_light), 0.0);  // reflected Lr,d

        vec3 wr = 2.0 * dot(n.xyz, to_light) * n.xyz - to_light;  // w_r
        vec4 phong = specular * incident_light * pow(max(dot(wr, observer), 0.0), shininess);  // Lr,s (Phong)

        // vec3 omega_h = normalize(to_light + observer);  // w_h
        // vec4 blinn_phong = specular * incident_light * pow(max(dot(n.xyz, omega_h), 0.0), shininess);  // Lr,s (BP)

        v_color = reflected + phong + diffuse_coef * ambient;  // Lr
        
    }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    varying vec4 v_color;
    void main() {
        gl_FragColor = v_color;
    }
</script>

<script type="text/javascript" src="../angelCommon/webgl-utils.js"></script>
<script type="text/javascript" src="../angelCommon/initShaders.js"></script>
<script type="text/javascript" src="../angelCommon/MV.js"></script>
<script type="text/javascript" src="W04P5.js"></script>
<body>

</canvas>

<button id="SubdivideButton-">Decrease subdivision</button>
<button id="Spin">Spin</button>
</div>
  <div>
    <input type="range" id="Kd" name="Kd" min="0" max="1" value="0.9" step="0.01" />
    Kd (diffuse)
  </div>
  <div>
    <input type="range" id="Ks" name="Ks" min="0" max="1" value="1.0"step="0.01" />
    Ks (specular)
  </div>
  <div>
    <input type="range" id="s" name="s" min="1" max="1000" value="100"step="0.01" />
    s (shininess)
  </div>
  <div>
    <input type="range" id="Le" name="Le" min="0" max="2.0" value="1.0"step="0.01" />
    Le (emission)
  </div>
  <div>
    <input type="range" id="La" name="La" min="0" max="1" value="0.1"step="0.01" />
    La (ambient)
  </div>
</body>
