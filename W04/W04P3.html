<html>
<script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 vPosition;
    attribute vec4 aColor;  // Receive color from js
    uniform mat4 MVP;

    varying vec4 v_color;  // Send color to fragment shader

    //uniform vec4 lighEmiss; // ld
    uniform vec4 lightPos;  // le
    uniform float kd;  // kd
    uniform vec4 La; 
    uniform vec4 Le;
    void main() {
        gl_Position = MVP * vPosition;

        vec4 n = vPosition;
        n.w = 0.0;
        
        vec3 w_i = lightPos.w == 0.0 ? normalize(-lightPos.xyz) : normalize(lightPos.xyz - vPosition.xyz);
        vec4 Lo = kd * Le * max(dot(n.xyz, w_i), 0.0) + kd * La;
        Lo.a = 1.0;
        
        v_color = Lo * (0.5*aColor+0.5);
    }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    varying vec4 v_color;
    void main() {
        gl_FragColor = v_color;
    }
</script>

<script type="text/javascript" src="../angelCommon/webgl-utils.js"></script>
<script type="text/javascript" src="../angelCommon/initShaders.js"></script>
<script type="text/javascript" src="../angelCommon/MV.js"></script>
<script type="text/javascript" src="W04P3.js"></script>

</canvas>

</body>
</html>
