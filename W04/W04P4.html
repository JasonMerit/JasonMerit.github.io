<html>
<script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 vPosition;
    attribute vec4 aColor;  // Receive color from js
    uniform mat4 MVP;
    uniform mat4 V;
    const float Vc = 1.0;

    varying vec4 v_color;  // Send color to fragment shader

    //uniform vec4 lighEmiss; // ld
    uniform vec4 lightPos;  // le
    uniform float kd;  // kd
    uniform vec4 La; 
    uniform vec4 Le;

    //Phong parameters
    uniform float ks;
    uniform float s; // shininess
    
    void main() {
        gl_Position = MVP * vPosition;
        vec4 Li = Vc * Le;  // Incident light

        vec4 n = V * vPosition;
        n.w = 0.0;
        vec4 light = V * lightPos;
        
        vec3 w_i = light.w == 0.0 ? normalize(-light.xyz) : normalize(light.xyz - vPosition.xyz);
        vec4 Lrd = kd * Li * max(dot(n.xyz, w_i), 0.0);
        vec3 w_r = 2.0 * dot(n.xyz, w_i) * n.xyz - w_i;
        //vec3 w_o = normalize(-vPosition.xyz);  // Observer
        vec3 w_o = -normalize((V*vPosition).xyz);
        vec4 LPrs = ks * Li * pow(max(dot(w_r, w_o), 0.0), s);
        vec4 Lo = Lrd + LPrs + kd * La;
        //Lo = LPrs;
        Lo.a = 1.0;
        
        v_color = Lo * (0.5*aColor+0.5);
    }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;
    varying vec4 v_color;
    void main() {
        gl_FragColor = v_color;
    }
</script>

<script type="text/javascript" src="../angelCommon/webgl-utils.js"></script>
<script type="text/javascript" src="../angelCommon/initShaders.js"></script>
<script type="text/javascript" src="../angelCommon/MV.js"></script>
<script type="text/javascript" src="W04P4.js"></script>
<body>

Sorry; your web browser does not support HTML5's canvas element.
</canvas>

<button id="SubdivideButton-">Decrease subdivision</button>
</body>
</html>
